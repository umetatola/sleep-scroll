# XcodeGen spec. Generate the project with `xcodegen generate` (on a Mac or in CI); the .xcodeproj is not committed.
name: SleepScroll

options:
  bundleIdPrefix: com.sleepscroll
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

packages:
  SleepScrollCore:
    path: SleepScrollCore

targets:
  SleepScroll:
    type: application
    platform: iOS
    sources: [App, Shared]
    dependencies:
      - package: SleepScrollCore
      - target: SleepScrollMonitor
      - target: SleepScrollShieldConfig
      - target: SleepScrollShieldAction
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: sleep-scroll
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    entitlements:
      path: App/SleepScroll.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.sleepscroll.ios]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sleepscroll.ios

  # Woken by iOS at each phase boundary and at bedtime.
  SleepScrollMonitor:
    type: app-extension
    platform: iOS
    sources: [Monitor, Shared]
    dependencies:
      - package: SleepScrollCore
    info:
      path: Monitor/Info.plist
      properties:
        CFBundleDisplayName: sleep-scroll Monitor
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).Monitor
    entitlements:
      path: Monitor/Monitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.sleepscroll.ios]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sleepscroll.ios.monitor

  # Draws the shield (title, subtitle, buttons) over a chosen app.
  SleepScrollShieldConfig:
    type: app-extension
    platform: iOS
    sources: [ShieldConfig, Shared]
    dependencies:
      - package: SleepScrollCore
    info:
      path: ShieldConfig/Info.plist
      properties:
        CFBundleDisplayName: sleep-scroll Shield
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfig
    entitlements:
      path: ShieldConfig/ShieldConfig.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.sleepscroll.ios]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sleepscroll.ios.shieldconfig

  # Handles the shield's "Close app" / "Snooze" buttons.
  SleepScrollShieldAction:
    type: app-extension
    platform: iOS
    sources: [ShieldAction, Shared]
    dependencies:
      - package: SleepScrollCore
    info:
      path: ShieldAction/Info.plist
      properties:
        CFBundleDisplayName: sleep-scroll Shield Action
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldActionHandler
    entitlements:
      path: ShieldAction/ShieldAction.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.sleepscroll.ios]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sleepscroll.ios.shieldaction

schemes:
  SleepScroll:
    build:
      targets:
        SleepScroll: all
